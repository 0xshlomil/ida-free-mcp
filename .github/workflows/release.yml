name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: ida_mcp.so
          - os: windows-latest
            name: windows-x64
            artifact: ida_mcp.dll
          - os: macos-latest
            name: macos-universal
            artifact: ida_mcp.dylib

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build tests
        run: |
          cmake -S . -B build/tests -DBUILD_PLUGIN=OFF -DBUILD_TESTS=ON
          cmake --build build/tests --config Release

      - name: Run tests
        working-directory: build/tests
        run: ctest -C Release --output-on-failure

      - name: Build plugin
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Build each architecture against its own SDK lib, then merge into a
            # universal binary (the runner is arm64, so a plain build would be
            # arm64-only and useless on Intel Macs)
            for arch in arm64 x64; do
              if [ "$arch" = "arm64" ]; then osx_arch=arm64; else osx_arch=x86_64; fi
              cmake -S . -B "build/plugin-$arch" -DBUILD_PLUGIN=ON -DBUILD_TESTS=OFF -DIDASDK=idasdk/src -DIDA_ARCH="$arch" -DCMAKE_OSX_ARCHITECTURES="$osx_arch"
              cmake --build "build/plugin-$arch" --config Release
            done
            lipo -create build/plugin-arm64/ida_mcp.dylib build/plugin-x64/ida_mcp.dylib -output "ida_mcp-${{ matrix.name }}.dylib"
          else
            cmake -S . -B build/plugin -DBUILD_PLUGIN=ON -DBUILD_TESTS=OFF -DIDASDK=idasdk/src
            cmake --build build/plugin --config Release
          fi

      - name: Upload plugin to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Universal binary was already produced with its final name
            dest="ida_mcp-macos-universal.dylib"
            # Strip rpaths pointing at the CI checkout (they don't exist on user machines;
            # IDA's own rpath resolves @rpath/libida.dylib at load time). Each slice
            # carries its own SDK lib rpath and install_name_tool requires the path to
            # exist in every slice, so operate on thinned slices and re-merge.
            lipo "$dest" -thin arm64 -output /tmp/thin-arm64.dylib
            lipo "$dest" -thin x86_64 -output /tmp/thin-x86_64.dylib
            for thin in /tmp/thin-arm64.dylib /tmp/thin-x86_64.dylib; do
              otool -l "$thin" | awk '/LC_RPATH/{found=1; next} found && $1=="path"{print $2; found=0}' | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$thin"
              done
            done
            lipo -create /tmp/thin-arm64.dylib /tmp/thin-x86_64.dylib -output "$dest"
            # Re-apply an ad-hoc signature after modifying the binary
            codesign --force --sign - "$dest"
          else
            # MSVC puts binaries in Release/ subdirectory
            if [ -f "build/plugin/Release/${{ matrix.artifact }}" ]; then
              src="build/plugin/Release/${{ matrix.artifact }}"
            else
              src="build/plugin/${{ matrix.artifact }}"
            fi
            ext="${{ matrix.artifact }}"
            ext=".${ext##*.}"
            dest="ida_mcp-${{ matrix.name }}${ext}"
            cp "$src" "$dest"
          fi
          gh release upload ${{ github.ref_name }} "$dest" --clobber
